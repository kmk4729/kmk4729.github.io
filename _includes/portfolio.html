<section class="no-padding" id="portfolio">
    <div class="container-fluid">
        <div class="row no-gutter">
            {% assign projects = site.github.public_repositories | where: "fork", false | sort: "stargazers_count" | reverse %}
            {% for project in projects limit:6 %}
            <div class="col-lg-4 col-sm-6">
                <a href="{{ project.html_url }}" class="portfolio-box" target="_blank">
                    <img src="img/portfolio/{{ forloop.index }}.jpg" class="img-responsive" alt="{{ project.name }}">
                    <div class="portfolio-box-caption">
                        <div class="portfolio-box-caption-content">
                            <div class="project-category text-faded">
                                {{ project.language }}
                            </div>
                            <div class="project-name">
                                {{ project.name }}
                            </div>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
