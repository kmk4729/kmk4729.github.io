<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>
  {% include nav.html %}

  <div class="container" style="padding-top: 100px;">
      <div class="row">
          <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
              <div class="post-heading">
                  <h1>{{ page.title }}</h1>
                  <span class="meta">Posted on {{ page.date | date: "%B %-d, %Y" }}</span>
              </div>
              <hr>
              <article>
                  {{ content }}
              </article>
              <hr>
          </div>
      </div>
  </div>

  {% include scripts.html %}
</body>

</html>
